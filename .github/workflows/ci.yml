name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tablesync
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tablesync
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npm run db:deploy
      - run: npm run db:seed
      - run: npm run db:seed
      - run: npx prisma migrate status
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run test:db
      - run: npm run security:secrets
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Install Playwright browsers and dependencies
        run: |
          # Playwright downloads its own browsers; the runner's Chrome feed is unused.
          sudo rm -f -- /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e

